<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<title>KoreanMaster</title>

<style>
:root{
  --main:#0d1b2a;
  --sub:#1b263b;
  --sub2:#24364f;
  --on:#ffffff;
  --text:#111827;
  --press:#9aa3af;
  --shadow:rgba(0,0,0,.32);
  --line:#d7dee8;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:var(--main);
  color:var(--on);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
  transition:.25s;
}

button{
  font-family:inherit;
}

.hidden{
  display:none !important;
}

.app{
  max-width:760px;
  min-height:100vh;
  margin:0 auto;
  padding-bottom:100px;
}

.pressable{
  transition:.15s;
}

.pressable:active{
  background:var(--press) !important;
  color:#fff !important;
  box-shadow:0 0 0 4px rgba(160,160,160,.32) !important;
  transform:scale(.985);
}

.choice-selected{
  background:#0d1b2a !important;
  color:#fff !important;
  border-color:#0d1b2a !important;
  box-shadow:0 0 0 3px rgba(13,27,42,.25) !important;
}

/* splash */
#splash{
  position:fixed;
  inset:0;
  background:var(--main);
  z-index:3000;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  animation:splashOut .75s ease 1.2s forwards;
}

#splash img{
  width:86px;
  height:86px;
  max-width:86px;
  max-height:86px;
  object-fit:contain;
  margin-bottom:12px;
}

#splash .title{
  font-size:28px;
  font-weight:800;
}

@keyframes splashOut{
  to{
    opacity:0;
    visibility:hidden;
  }
}

/* header */
.topbar{
  position:sticky;
  top:0;
  z-index:90;
  height:64px;
  max-height:64px;
  background:var(--main);
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 16px;
  box-shadow:0 4px 12px rgba(0,0,0,.2);
  overflow:hidden;
  transition:.25s;
}

.brand-wrap{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.logo{
  width:36px;
  height:36px;
  max-width:36px;
  max-height:36px;
  object-fit:contain;
  display:block;
  flex-shrink:0;
}

.brand{
  font-size:22px;
  font-weight:800;
  white-space:nowrap;
}

.menu-btn{
  border:none;
  background:transparent;
  color:var(--on);
  font-size:24px;
  border-radius:10px;
  padding:8px 10px;
}

/* top filter */
.top-filter{
  position:sticky;
  top:64px;
  z-index:80;
  background:var(--sub);
  padding:10px;
  box-shadow:0 4px 10px rgba(0,0,0,.12);
  transition:.25s;
}

.filter-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}

.left-filter,
.right-filter{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
}

.left-filter{
  overflow-x:auto;
  white-space:nowrap;
}

.left-filter::-webkit-scrollbar,
.noun-row::-webkit-scrollbar,
.style-row::-webkit-scrollbar{
  display:none;
}

.left-filter,
.noun-row,
.style-row{
  scrollbar-width:none;
}

.chip{
  border:none;
  background:var(--sub2);
  color:var(--on);
  border-radius:999px;
  padding:10px 14px;
  font-weight:800;
  white-space:nowrap;
}

.chip.active{
  background:#fff;
  color:#0d1b2a;
}

.status-chip{
  min-width:44px;
  height:38px;
  border:none;
  border-radius:999px;
  background:var(--sub2);
  color:var(--on);
  font-weight:900;
  font-size:17px;
}

.status-chip.active{
  background:#fff;
  color:#0d1b2a;
}

/* sub bars */
.noun-subbar,
.style-subbar{
  position:sticky;
  top:116px;
  z-index:75;
  padding:8px 10px 10px;
  background:var(--sub2);
  box-shadow:0 4px 10px rgba(0,0,0,.1);
}

.bar-title{
  font-size:12px;
  font-weight:800;
  margin:0 0 6px 2px;
}

.noun-row,
.style-row{
  display:flex;
  gap:8px;
  overflow-x:auto;
  white-space:nowrap;
}

/* screens */
.screen{
  display:none;
  padding:12px 0 22px;
}

.screen.active{
  display:block;
  animation:screenFade .2s ease;
}

@keyframes screenFade{
  from{
    opacity:.4;
    transform:translateY(6px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  padding:0 20px 10px;
}

.action-btn{
  border:none;
  background:var(--sub);
  color:var(--on);
  border-radius:10px;
  padding:10px 14px;
  font-weight:800;
  box-shadow:0 4px 0 rgba(0,0,0,.24);
}

.action-btn.secondary{
  background:var(--sub2);
}

.action-btn.light{
  background:#fff;
  color:#0d1b2a;
  border:2px solid var(--line);
  box-shadow:none;
}

/* cards */
.card-list{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.word-card,
.phrase-card,
.sentence-card,
.wrong-card{
  margin:0 20px;
  padding:14px;
  border-radius:10px;
  background:#fff;
  color:var(--text);
  box-shadow:0 8px 18px var(--shadow);
  border:1px solid rgba(15,23,42,.06);
}

.word-card:active,
.phrase-card:active,
.sentence-card:active,
.wrong-card:active{
  background:#f1f5f9;
  transform:scale(.992);
}

.top-row{
  display:flex;
  gap:10px;
  justify-content:space-between;
  align-items:flex-start;
}

.card-left{
  flex:1;
  min-width:0;
}

.kr{
  font-size:24px;
  font-weight:800;
  color:#0f172a;
  margin-bottom:6px;
  word-break:break-all;
}

.meta-row{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  min-height:24px;
}

.pron{
  font-size:13px;
  color:#6b7280;
  line-height:1.4;
}

/* 答えは最初は非表示。カードタップ後、元々属性タグがあった位置に表示 */
.inline-answer{
  display:none;
  font-size:13px;
  font-weight:800;
  color:#334155;
  line-height:1.4;
}

.word-card.show .inline-answer,
.phrase-card.show .inline-answer{
  display:inline-block;
}

/* 属性タグは廃止 */
.tag-row,
.tag{
  display:none;
}

.word-actions{
  width:90px;
  display:flex;
  flex-direction:column;
  gap:6px;
  align-items:flex-end;
  flex-shrink:0;
}

.audio-btn{
  width:42px;
  height:42px;
  border:none;
  border-radius:10px;
  background:var(--main);
  color:var(--on);
  font-size:18px;
}

.mark-row{
  display:flex;
  gap:6px;
  justify-content:flex-end;
  align-items:center;
}

.mark-btn{
  width:42px;
  height:42px;
  border:none;
  border-radius:10px;
  font-weight:900;
  font-size:18px;
  background:#eef2f9;
  color:#0d1b2a;
}

/* panels */
.sentence-board,
.quiz-box,
.gacha-box{
  margin:0 20px 12px;
  padding:16px;
  border-radius:10px;
  background:#fff;
  color:var(--text);
  box-shadow:0 8px 18px var(--shadow);
}

.sentence-title,
.quiz-progress{
  font-size:13px;
  font-weight:800;
  color:#54606d;
  margin-bottom:8px;
  white-space:pre-line;
}

.sentence-text,
.quiz-question{
  font-size:24px;
  font-weight:800;
  color:#0f172a;
  line-height:1.5;
  margin-bottom:10px;
}

.sentence-jp{
  display:none;
  padding:12px;
  border-radius:10px;
  background:#f4f7fb;
  color:#334155;
  line-height:1.6;
}

.sentence-board.show .sentence-jp{
  display:block;
}

.saved-title,
.wrong-title{
  margin:18px 20px 12px;
  font-size:16px;
  font-weight:800;
}

/* quiz */
.answers{
  display:grid;
  gap:10px;
}

.answer-btn{
  border:none;
  background:#eef2f9;
  color:#0d1b2a;
  border-radius:10px;
  padding:14px;
  text-align:left;
  font-weight:800;
}

.quiz-result{
  margin-top:12px;
  padding:12px;
  border-radius:10px;
  background:#f4f7fb;
  color:#334155;
  line-height:1.6;
  white-space:pre-line;
}

/* gacha */
.coin-row{
  display:flex;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:12px;
}

.coin-badge{
  background:var(--main);
  color:var(--on);
  padding:10px 14px;
  border-radius:999px;
  font-weight:800;
}

.gacha-stage{
  min-height:150px;
  border:2px dashed #cfd8e5;
  border-radius:10px;
  background:#f7f9fd;
  color:#5c6675;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  margin-bottom:14px;
}

.gacha-log{
  margin-top:14px;
  padding:12px;
  background:#f7f9fd;
  border-radius:10px;
  min-height:100px;
}

.gacha-item{
  padding:8px 0;
  color:#334155;
  border-bottom:1px solid #e5e7eb;
}

/* stats */
.stats-box{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin:12px 20px 0;
}

.stat{
  background:#fff;
  color:var(--text);
  border-radius:10px;
  padding:14px;
  box-shadow:0 8px 18px var(--shadow);
}

.stat-label{
  font-size:12px;
  color:#637083;
  font-weight:800;
}

.stat-value{
  font-size:22px;
  font-weight:800;
  color:#0f172a;
}

/* fab */
.fab{
  position:fixed;
  right:18px;
  bottom:100px;
  width:58px;
  height:58px;
  border:none;
  border-radius:50%;
  background:var(--sub);
  color:var(--on);
  font-size:32px;
  box-shadow:0 8px 18px rgba(0,0,0,.35);
  z-index:90;
}

/* bottom nav */
.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:80;
  display:flex;
  background:var(--main);
  box-shadow:0 -6px 18px rgba(0,0,0,.16);
}

.tab-btn{
  flex:1;
  border:none;
  background:transparent;
  color:var(--on);
  padding:13px 4px 17px;
  font-size:13px;
  font-weight:800;
  opacity:.72;
}

.tab-btn.active{
  opacity:1;
  background:rgba(255,255,255,.14);
}

/* modal */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  display:none;
  justify-content:center;
  align-items:center;
  padding:20px;
  z-index:1000;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:min(520px,100%);
  max-height:90vh;
  overflow:auto;
  background:#fff;
  color:var(--text);
  padding:18px;
  border-radius:12px;
  box-shadow:0 20px 40px rgba(0,0,0,.35);
}

.modal-title{
  font-size:20px;
  font-weight:800;
  margin-bottom:12px;
}

.field{
  margin-bottom:12px;
}

.field label{
  display:block;
  font-size:13px;
  font-weight:800;
  margin-bottom:6px;
}

.field input,
.field select{
  width:100%;
  padding:10px 12px;
  border:1px solid #cfd8e3;
  border-radius:10px;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  flex-wrap:wrap;
}

/* settings */
.settings-backdrop{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.35);
  backdrop-filter:blur(5px);
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:1400;
}

.settings-backdrop.show{
  opacity:1;
  pointer-events:auto;
}

.settings-panel{
  position:fixed;
  top:0;
  right:0;
  width:min(340px,86vw);
  height:100vh;
  background:#fff;
  color:var(--text);
  transform:translateX(100%);
  transition:.25s;
  z-index:1500;
  padding:20px;
  box-shadow:-8px 0 28px rgba(0,0,0,.3);
  display:flex;
  flex-direction:column;
  gap:12px;
}

.settings-panel.show{
  transform:translateX(0);
}

.settings-title{
  font-size:22px;
  font-weight:800;
}

.settings-section{
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:12px;
}

.settings-section-title{
  font-size:14px;
  font-weight:800;
  margin-bottom:10px;
}

.settings-col{
  display:grid;
  gap:8px;
}

.empty{
  margin:0 20px;
  padding:18px;
  border-radius:10px;
  background:#fff;
  color:#526072;
  box-shadow:0 8px 18px var(--shadow);
}
</style>
</head>

<body>

<div id="splash">
  <img src="logo.png" alt="logo">
  <div class="title">KoreanMaster</div>
</div>

<div class="app">
<header class="topbar">
  <div class="brand-wrap">
    <img src="logo.png" class="logo" alt="logo">
    <div class="brand">KoreanMaster</div>
  </div>
  <button class="menu-btn pressable" id="settingsBtn">≡</button>
</header>

<div class="top-filter">
  <div class="filter-row">
    <div class="left-filter" id="leftFilter"></div>
    <div class="right-filter" id="rightFilter"></div>
  </div>
</div>

<div class="noun-subbar hidden" id="nounSubbar">
  <div class="bar-title">名詞の分類</div>
  <div class="noun-row" id="nounSubRow"></div>
</div>

<div class="style-subbar hidden" id="styleSubbar">
  <div class="bar-title">文体</div>
  <div class="style-row" id="styleRow"></div>
</div>

<section class="screen active" id="screen-word">
  <div class="card-list" id="wordList"></div>
</section>

<section class="screen" id="screen-phrase">
  <div class="card-list" id="phrasePanel"></div>
</section>

<section class="screen" id="screen-random">
  <div class="toolbar">
    <button class="action-btn secondary pressable" id="randomSentenceBtn">ランダム表示</button>
    <button class="action-btn secondary pressable" id="saveSentenceBtn">保存</button>
    <button class="action-btn secondary pressable" id="speakSentenceBtn">読み上げ</button>
  </div>

  <div class="sentence-board" id="sentenceBoard">
    <div class="sentence-title">表示中の文章</div>
    <div class="sentence-text" id="sentenceText">ボタンを押すとここに文章が出ます</div>
    <div class="sentence-jp" id="sentenceJp">日本語訳</div>
  </div>

  <div class="saved-title">保存した文章</div>
  <div class="card-list" id="savedSentenceList"></div>
</section>

<section class="screen" id="screen-quiz">
  <div class="toolbar">
    <button class="action-btn secondary pressable" id="selectNormalQuizBtn">10問クイズ</button>
    <button class="action-btn secondary pressable" id="selectEndlessQuizBtn">エンドレスモード</button>
    <button class="action-btn light pressable hidden" id="endEndlessBtn">終了</button>
  </div>

  <div class="quiz-box" id="quizBox">
    <div class="quiz-result">
10問クイズを押すと品詞を選択できます。
コイン報酬は「すべて」で10問全問正解したときのみです。
    </div>
  </div>

  <div class="wrong-title">間違えた単語（最大50）</div>
  <div class="card-list" id="wrongWordList"></div>
</section>

<section class="screen" id="screen-gacha">
  <div class="gacha-box">
    <div class="coin-row">
      <div class="coin-badge">コイン: <span id="coinDisplay">0</span></div>
      <div>1回 500 / 10連 5000</div>
    </div>

    <div class="gacha-stage" id="gachaStage">ガチャ結果がここに出ます。</div>

    <div class="toolbar">
      <button class="action-btn pressable" id="gachaOneBtn">1回引く</button>
      <button class="action-btn secondary pressable" id="gachaTenBtn">10連引く</button>
    </div>

    <div class="gacha-log" id="gachaLog"></div>
  </div>

  <div class="stats-box">
    <div class="stat">
      <div class="stat-label">所持単語数</div>
      <div class="stat-value" id="statWordCount">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">獲得ガチャ語</div>
      <div class="stat-value" id="statGachaCount">0</div>
    </div>
  </div>
</section>

<button class="fab pressable" id="fabBtn">＋</button>

<nav class="bottom-nav">
  <button class="tab-btn pressable active" data-tab="word">単語帳</button>
  <button class="tab-btn pressable" data-tab="phrase">フレーズ</button>
  <button class="tab-btn pressable" data-tab="random">ランダム</button>
  <button class="tab-btn pressable" data-tab="quiz">クイズ</button>
  <button class="tab-btn pressable" data-tab="gacha">ガチャ</button>
</nav>
</div>

<div class="modal" id="addWordModal">
  <div class="modal-box">
    <div class="modal-title">単語を追加</div>

    <div class="field">
      <label>韓国語</label>
      <input id="newKr">
    </div>

    <div class="field">
      <label>日本語</label>
      <input id="newJp">
    </div>

    <div class="field">
      <label>英語表記</label>
      <input id="newRoman">
    </div>

    <div class="field">
      <label>カタカナ表記</label>
      <input id="newKana">
    </div>

    <div class="field">
      <label>分類</label>
      <select id="newType">
        <option value="noun">名詞</option>
        <option value="verb">動詞</option>
        <option value="adj">形容詞</option>
        <option value="adv">副詞</option>
        <option value="conj">接続詞</option>
        <option value="react">リアクション</option>
        <option value="time">時間</option>
        <option value="pronoun">代名詞</option>
        <option value="question">疑問詞</option>
        <option value="number">数詞</option>
      </select>
    </div>

    <div class="field" id="newNounSubTypeField">
      <label>名詞分類</label>
      <select id="newSubType">
        <option value="person">人</option>
        <option value="food">食べ物</option>
        <option value="place">場所</option>
        <option value="thing">物</option>
      </select>
    </div>

    <div class="modal-actions">
      <button class="action-btn light pressable" id="cancelAddWordBtn">キャンセル</button>
      <button class="action-btn pressable" id="submitAddWordBtn">追加</button>
    </div>
  </div>
</div>

<div class="modal" id="addPhraseModal">
  <div class="modal-box">
    <div class="modal-title">フレーズを追加</div>

    <div class="field">
      <label>分類</label>
      <select id="newPhraseCategory"></select>
    </div>

    <div class="field">
      <label>文体</label>
      <select id="newPhraseStyle">
        <option value="casual">ため口</option>
        <option value="haeyo">へヨ体</option>
        <option value="hamnida">ハムニダ体</option>
      </select>
    </div>

    <div class="field">
      <label>韓国語</label>
      <input id="newPhraseKr">
    </div>

    <div class="field">
      <label>日本語</label>
      <input id="newPhraseJp">
    </div>

    <div class="field">
      <label>英語表記</label>
      <input id="newPhraseRoman">
    </div>

    <div class="field">
      <label>カタカナ表記</label>
      <input id="newPhraseKana">
    </div>

    <div class="modal-actions">
      <button class="action-btn light pressable" id="cancelAddPhraseBtn">キャンセル</button>
      <button class="action-btn pressable" id="submitAddPhraseBtn">追加</button>
    </div>
  </div>
</div>

<div class="settings-backdrop" id="settingsBackdrop"></div>

<aside class="settings-panel" id="settingsPanel">
  <div class="settings-title">設定</div>

  <div class="settings-section">
    <div class="settings-section-title">背景設定</div>
    <div class="settings-col">
      <button class="action-btn light pressable" id="bgNavyBtn">紺色</button>
      <button class="action-btn light pressable" id="bgBeigeBtn">ベージュ</button>
    </div>
  </div>

  <div class="settings-section">
    <div class="settings-section-title">発音表記</div>
    <div class="settings-col">
      <button class="action-btn light pressable" id="pronRomanBtn">英語表記</button>
      <button class="action-btn light pressable" id="pronKanaBtn">カタカナ表記</button>
    </div>
  </div>

  <div class="settings-section">

function loadState(){
  try{ Object.assign(state, JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}")); }catch(e){}
  try{ state.customWords = JSON.parse(localStorage.getItem(CUSTOM_WORDS_KEY) || "[]"); }catch(e){}
  try{ state.customPhrases = JSON.parse(localStorage.getItem(CUSTOM_PHRASES_KEY) || "{}"); }catch(e){}
  try{ state.gachaWords = JSON.parse(localStorage.getItem(GACHA_WORDS_KEY) || "[]"); }catch(e){}
  try{ state.savedSentences = JSON.parse(localStorage.getItem(SAVED_SENTENCES_KEY) || "[]"); }catch(e){}
  try{ state.wrongWords = JSON.parse(localStorage.getItem(WRONG_WORDS_KEY) || "[]"); }catch(e){}
  try{ state.marks = JSON.parse(localStorage.getItem(MARKS_KEY) || "{}"); }catch(e){}
}

function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    currentTab:state.currentTab,
    wordType:state.wordType,
    nounSubType:state.nounSubType,
    wordStatus:state.wordStatus,
    typeExpanded:state.typeExpanded,
    quizType:state.quizType,
    quizTypeExpanded:state.quizTypeExpanded,
    quizTypeBarVisible:state.quizTypeBarVisible,
    currentPhraseCategory:state.currentPhraseCategory,
    phraseStyle:state.phraseStyle,
    randomStyle:state.randomStyle,
    coin:state.coin,
    sentence:state.sentence,
    sentenceJp:state.sentenceJp,
    bestScore:state.bestScore,
    bgMode:state.bgMode,
    pronMode:state.pronMode
  }));

  localStorage.setItem(CUSTOM_WORDS_KEY, JSON.stringify(state.customWords));
  localStorage.setItem(CUSTOM_PHRASES_KEY, JSON.stringify(state.customPhrases));
  localStorage.setItem(GACHA_WORDS_KEY, JSON.stringify(state.gachaWords));
  localStorage.setItem(SAVED_SENTENCES_KEY, JSON.stringify(state.savedSentences));
  localStorage.setItem(WRONG_WORDS_KEY, JSON.stringify(state.wrongWords));
  localStorage.setItem(MARKS_KEY, JSON.stringify(state.marks));

function setTheme(main,sub,sub2,on){
  document.documentElement.style.setProperty("--main",main);
  document.documentElement.style.setProperty("--sub",sub);
  document.documentElement.style.setProperty("--sub2",sub2);
  document.documentElement.style.setProperty("--on",on);
  document.body.style.background = main;
}

function applyTheme(){
  if(state.bgMode === "beige"){
    setTheme("#E7D0A9","#d6b98e","#c6a477","#0d1b2a");
  }else{
    setTheme("#0d1b2a","#1b263b","#24364f","#ffffff");
  }
  renderSelectedButtons();
}

function enterEndlessTheme(){
  setTheme("#740125","#8b1430","#9d1b39","#ffffff");
}

function exitEndlessTheme(){
  applyTheme();
}

function getPron(item){
  return state.pronMode === "kana" ? item.kana || "" : item.roman || "";
}

function getBaseWords(){
  return [...RAW_WORDS, ...state.customWords];
}

function getGachaOwnedWords(){
  return state.gachaWords.map(w=>({
    kr:w.kr,
    jp:w.jp,
    roman:w.roman || "",
    kana:w.kana || "",
    type:"gacha",
    fromGacha:true
  }));
}

function getAllWords(){
  const base = getBaseWords();
  const baseKeys = new Set(base.map(w=>w.kr));
  const gachaOnlyNew = getGachaOwnedWords().filter(w=>!baseKeys.has(w.kr));
  return [...base, ...gachaOnlyNew];
}

function isGachaOwned(kr){
  return state.gachaWords.some(w=>w.kr === kr);
}

function getWordsByType(type){
  if(type === "gacha") return getGachaOwnedWords();

  let words = getAllWords();

  if(type !== "all"){
    words = words.filter(w=>w.type === type);
  }

  return words;
}

function getVisibleWords(){
  let words = getWordsByType(state.wordType);

  if(state.wordType === "noun" && state.nounSubType !== "all"){
    words = words.filter(w=>(w.subType || "thing") === state.nounSubType);
  }

  if(state.wordStatus !== "all"){
    words = words.filter(w=>state.marks[w.kr] === state.wordStatus);
  }

  return words;
}

function typeLabel(type){
  return {
    all:"すべて",
    noun:"名詞",
    verb:"動詞",
    adj:"形容詞",
    adv:"副詞",
    conj:"接続詞",
    react:"リアクション",
    time:"時間",
    pronoun:"代名詞",
    question:"疑問詞",
    number:"数詞",
    gacha:"ガチャ"
  }[type] || type;
}

function phraseStyleLabel(style){
  return {
    casual:"ため口",
    haeyo:"へヨ体",
    hamnida:"ハムニダ体"
  }[style] || style;
}

function escapeHtml(str){
  return String(str || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function pickRandom(arr){
  return arr[Math.floor(Math.random()*arr.length)];
}

function shuffle(arr){
  return [...arr].sort(()=>Math.random()-.5);
}

function setSelectedButton(button, isSelected){
  if(!button) return;
  button.classList.toggle("choice-selected", isSelected);
}

function renderSelectedButtons(){
  setSelectedButton(document.getElementById("bgNavyBtn"), state.bgMode === "navy");
  setSelectedButton(document.getElementById("bgBeigeBtn"), state.bgMode === "beige");
  setSelectedButton(document.getElementById("pronRomanBtn"), state.pronMode === "roman");
  setSelectedButton(document.getElementById("pronKanaBtn"), state.pronMode === "kana");
}

function renderTopBars(){
  const left = document.getElementById("leftFilter");
  const right = document.getElementById("rightFilter");
  const nounBar = document.getElementById("nounSubbar");
  const styleBar = document.getElementById("styleSubbar");

  nounBar.classList.add("hidden");
  styleBar.classList.add("hidden");
  right.innerHTML = "";

  if(state.currentTab === "word"){
    if(state.typeExpanded){
      left.innerHTML = `
        <button class="chip active pressable" data-collapse-type>品詞</button>
        ${WORD_TYPES.map(([key,label])=>`
          <button class="chip pressable ${state.wordType===key?"active":""}" data-word-type="${key}">
            ${label}
          </button>
        `).join("")}
      `;
    }else{
      left.innerHTML = `
        <button class="chip active pressable" id="typeOpenBtn">品詞：${typeLabel(state.wordType)}</button>
      `;
    }

    right.innerHTML = `
      <button class="status-chip pressable ${state.wordStatus==="good"?"active":""}" data-status="good">〇</button>
      <button class="status-chip pressable ${state.wordStatus==="bad"?"active":""}" data-status="bad">×</button>
    `;

    if(state.wordType === "noun"){
      nounBar.classList.remove("hidden");
      document.getElementById("nounSubRow").innerHTML = NOUN_SUBTYPES.map(([key,label])=>`
        <button class="chip pressable ${state.nounSubType===key?"active":""}" data-noun-sub="${key}">
          ${label}
        </button>
      `).join("");
    }
  }

  else if(state.currentTab === "phrase"){
    left.innerHTML = Object.entries(PHRASE_TYPES).map(([key,label])=>`
      <button class="chip pressable ${state.currentPhraseCategory===key?"active":""}" data-phrase-type="${key}">
        ${label}
      </button>
    `).join("");

    styleBar.classList.remove("hidden");
    document.getElementById("styleRow").innerHTML = RANDOM_STYLES.map(([key,label])=>`
      <button class="chip pressable ${state.phraseStyle===key?"active":""}" data-phrase-style="${key}">
        ${label}
      </button>
    `).join("");
  }

  else if(state.currentTab === "random"){
    left.innerHTML = `<button class="chip active">ランダム文章</button>`;

    styleBar.classList.remove("hidden");
    document.getElementById("styleRow").innerHTML = RANDOM_STYLES.map(([key,label])=>`
      <button class="chip pressable ${state.randomStyle===key?"active":""}" data-style="${key}">
        ${label}
      </button>
    `).join("");
  }

  else if(state.currentTab === "quiz"){
    if(!state.quizTypeBarVisible){
      left.innerHTML = `<button class="chip active">クイズ</button>`;
      return;
    }

    if(state.quizTypeExpanded){
      left.innerHTML = `
        <button class="chip active pressable" data-collapse-quiz-type>品詞</button>
        ${WORD_TYPES.map(([key,label])=>`
          <button class="chip pressable ${state.quizType===key?"active":""}" data-quiz-type="${key}">
            ${label}
          </button>
        `).join("")}
      `;
    }else{
      left.innerHTML = `
        <button class="chip active pressable" id="quizTypeOpenBtn">品詞：${typeLabel(state.quizType)}</button>
      `;
    }
  }

  else{
    left.innerHTML = `<button class="chip active">${state.currentTab}</button>`;
  }
}

function renderWords(){
  const list = document.getElementById("wordList");
  const words = getVisibleWords();

  if(!words.length){
    list.innerHTML = `<div class="empty">表示できる単語がありません。</div>`;
    return;
  }

  list.innerHTML = words.map(item=>{
    const mark = state.marks[item.kr] || "";

    return `
      <div class="word-card">
        <div class="top-row">
          <div class="card-left">
            <div class="kr">${escapeHtml(item.kr)}</div>
            <div class="meta-row">
              <span class="pron">${escapeHtml(getPron(item))}</span>
              <span class="inline-answer">${escapeHtml(item.jp)}</span>
            </div>
          </div>

          <div class="word-actions">
            <button class="audio-btn pressable" data-audio="${escapeHtml(item.kr)}">🔊</button>
            <div class="mark-row">
              <button class="mark-btn pressable ${mark==="good"?"choice-selected":""}" data-mark-good="${escapeHtml(item.kr)}">〇</button>
              <button class="mark-btn pressable ${mark==="bad"?"choice-selected":""}" data-mark-bad="${escapeHtml(item.kr)}">×</button>
            </div>
          </div>
        </div>
      </div>
    `;
  }).join("");
}

function getPhrases(){
  const merged = JSON.parse(JSON.stringify(BASE_PHRASES));

  Object.keys(PHRASE_TYPES).forEach(k=>{
    if(!merged[k]) merged[k]=[];
    if(state.customPhrases[k]) merged[k].push(...state.customPhrases[k]);
  });

  return (merged[state.currentPhraseCategory] || []).filter(item=>{
    return (item.style || "haeyo") === state.phraseStyle;
  });
}

function renderPhrase(){
  const panel = document.getElementById("phrasePanel");
  const items = getPhrases();

  if(!items.length){
    panel.innerHTML = `<div class="empty">このジャンル・文体のフレーズはありません。</div>`;
    return;
  }

  panel.innerHTML = items.map(item=>`
    <div class="phrase-card">
      <div class="top-row">
        <div class="card-left">
          <div class="kr">${escapeHtml(item.kr)}</div>
          <div class="meta-row">
            <span class="pron">${escapeHtml(getPron(item))}</span>
            <span class="inline-answer">${escapeHtml(item.jp)}</span>
          </div>
        </div>

        <button class="audio-btn phrase-audio-btn pressable" data-audio="${escapeHtml(item.kr)}">🔊</button>
      </div>
    </div>
  `).join("");
}

function addWrongWord(item){
  state.wrongWords = state.wrongWords.filter(w=>w.kr !== item.kr);
  state.wrongWords.unshift({...item});
  if(state.wrongWords.length > 50) state.wrongWords.pop();
  saveState();
  renderWrongWords();
}

  if(tab === state.currentTab) return;

  state.currentTab = tab;

  document.querySelectorAll(".tab-btn").forEach(btn=>{
    btn.classList.toggle("active", btn.dataset.tab === tab);
  });

  document.querySelectorAll(".screen").forEach(screen=>{
    screen.classList.remove("active");
  });

  document.getElementById(`screen-${tab}`).classList.add("active");

  state.typeExpanded = false;
  state.quizTypeExpanded = false;

  if(tab !== "quiz"){
    state.quizTypeBarVisible = false;
  }

  renderTopBars();
  renderFab();

  if(tab === "word") renderWords();
  if(tab === "phrase") renderPhrase();

  if(tab === "random"){
    renderSentence();
    renderSavedSentences();
  }

  if(tab === "quiz") renderWrongWords();

  renderStats();
  saveState();
}

function showQuizStart(mode){
  document.getElementById("endEndlessBtn").classList.add("hidden");

  const box = document.getElementById("quizBox");

  if(mode === "normal"){
    box.innerHTML = `
      <div class="quiz-progress">10問クイズ / ジャンル：${typeLabel(state.quizType)}</div>
      <div class="quiz-result">
        選択中の品詞から10問出題されます。
        コイン報酬は「すべて」で10問全問正解した場合のみです。
      </div>
      <button class="action-btn secondary pressable" id="startNormalConfirm">開始する</button>
    `;
    document.getElementById("startNormalConfirm").onclick = startNormalQuiz;
  }

  if(mode === "endless"){
    box.innerHTML = `
      <div class="quiz-progress">エンドレスモード</div>
      <div class="quiz-result">間違えるまで続きます。10連続ごとにボーナス。</div>
      <button class="action-btn secondary pressable" id="startEndlessConfirm">開始する</button>
    `;
    document.getElementById("startEndlessConfirm").onclick = startEndlessQuiz;
  }
}

function startNormalQuiz(){
  exitEndlessTheme();

  const pool = getWordsByType(state.quizType);

  if(pool.length < 4){
    document.getElementById("quizBox").innerHTML = `
      <div class="quiz-result">このジャンルは単語が4つ以上必要です。</div>
    `;
    return;
  }

  state.quiz.mode = "normal";
  state.quiz.inProgress = true;
  state.quiz.items = shuffle(pool).slice(0,10);
  state.quiz.index = 0;
  state.quiz.score = 0;

  document.getElementById("endEndlessBtn").classList.add("hidden");
  renderQuizQuestion();
}

function renderQuizQuestion(){
  const current = state.quiz.items[state.quiz.index];

  if(!current){
    finishNormalQuiz();
    return;
  }

  const answerPool = getWordsByType(state.quizType).length >= 4
    ? getWordsByType(state.quizType)
    : getAllWords();

  const wrong = shuffle(answerPool.filter(w=>w.jp !== current.jp)).slice(0,3);
  const choices = shuffle([current, ...wrong]);

  document.getElementById("quizBox").innerHTML = `
    <div class="quiz-progress">
      問題 ${state.quiz.index + 1} / ${state.quiz.items.length} ・ ${state.quiz.score}点
      ジャンル：${typeLabel(state.quizType)}
    </div>
    <div class="quiz-question">${escapeHtml(current.kr)} の意味は？</div>
    <div class="answers">
      ${choices.map(c=>`
        <button class="answer-btn pressable" data-answer="${escapeHtml(c.jp)}">
          ${escapeHtml(c.jp)}
        </button>
      `).join("")}
    </div>
  `;
}

function finishNormalQuiz(){
  let message = "報酬なし。";

  if(state.quiz.score === 10 && state.quizType === "all"){
    state.coin += 100;
    message = "100コイン獲得！";
  }

  if(state.quiz.score === 10 && state.quizType !== "all"){
    message = "全問正解！ただしコイン報酬は「すべて」のみです。";
  }

  if(state.quiz.score > state.bestScore){
    state.bestScore = state.quiz.score;
  }

  state.quiz.inProgress = false;
  state.quiz.mode = null;

  document.getElementById("quizBox").innerHTML = `
    <div class="quiz-progress">終了</div>
    <div class="quiz-question">${state.quiz.score} / ${state.quiz.items.length}</div>
    <div class="quiz-result">${message}</div>
  `;

  renderStats();
  saveState();
}

function startEndlessQuiz(){
  enterEndlessTheme();

  const pool = getAllWords();

  if(pool.length < 4){
    document.getElementById("quizBox").innerHTML = `
      <div class="quiz-result">単語が4つ以上必要です。</div>
    `;
    return;
  }

  state.quiz.mode = "endless";
  state.quiz.inProgress = true;
  state.quiz.streak = 0;
  state.quiz.pendingCoins = 0;

  document.getElementById("endEndlessBtn").classList.remove("hidden");
  renderEndlessQuestion();
}

function renderEndlessQuestion(){
  const pool = getAllWords();
  const current = pickRandom(pool);
  state.quiz.currentQuestion = current;

  const wrong = shuffle(pool.filter(w=>w.jp !== current.jp)).slice(0,3);
  const choices = shuffle([current, ...wrong]);

  document.getElementById("quizBox").innerHTML = `
    <div class="quiz-progress">エンドレス
連続正解: ${state.quiz.streak}
保留コイン: ${state.quiz.pendingCoins}</div>
    <div class="quiz-question">${escapeHtml(current.kr)} の意味は？</div>
    <div class="answers">
      ${choices.map(c=>`
        <button class="answer-btn pressable" data-answer="${escapeHtml(c.jp)}">
          ${escapeHtml(c.jp)}
        </button>
      `).join("")}
    </div>
  `;
}

function finishEndless(){
  state.coin += state.quiz.pendingCoins;

  const streak = state.quiz.streak;
  const coins = state.quiz.pendingCoins;

  state.quiz.inProgress = false;
  state.quiz.mode = null;
  state.quiz.pendingCoins = 0;

  document.getElementById("endEndlessBtn").classList.add("hidden");
  exitEndlessTheme();

  document.getElementById("quizBox").innerHTML = `
    <div class="quiz-progress">エンドレス終了</div>
    <div class="quiz-question">${streak}連続正解</div>
    <div class="quiz-result">${coins}コイン獲得。</div>
  `;

  renderStats();
  saveState();
}

function handleQuizAnswer(answer){
  if(!state.quiz.inProgress) return;

  if(state.quiz.mode === "normal"){
    const current = state.quiz.items[state.quiz.index];

    if(answer === current.jp){
      state.quiz.score++;
    }else{
      addWrongWord(current);
    }

    state.quiz.index++;

    if(state.quiz.index >= state.quiz.items.length){
      finishNormalQuiz();
    }else{
      renderQuizQuestion();
    }
  }

  if(state.quiz.mode === "endless"){
    const current = state.quiz.currentQuestion;

    if(answer === current.jp){
      state.quiz.streak++;

      if(state.quiz.streak % 10 === 0){
        state.quiz.pendingCoins += state.quiz.streak * 10;
      }

      renderEndlessQuestion();
    }else{
      addWrongWord(current);
      finishEndless();
    }
  }
}

function gachaPull(times){
  const cost = times === 10 ? 5000 : 500;

  if(state.coin < cost){
    document.getElementById("gachaStage").textContent = "コイン不足です。";
    return;
  }

  state.coin -= cost;
  const results = [];

  for(let i=0;i<times;i++){
    const item = pickRandom(GACHA_POOL);
    results.push(item);

    if(!state.gachaWords.some(w=>w.kr === item.kr)){
      state.gachaWords.push({
        kr:item.kr,
        jp:item.jp,
        roman:item.roman || "",
        kana:item.kana || "",
        type:"gacha"
      });
    }
  }

  document.getElementById("gachaStage").textContent = `${times}回引きました。`;

  document.getElementById("gachaLog").innerHTML = results.map(r=>`
    <div class="gacha-item">${escapeHtml(r.kr)} - ${escapeHtml(r.jp)}</div>
  `).join("");

  renderStats();
  saveState();

  if(state.currentTab === "word"){
    renderWords();
  }
}

function speakText(text){
  if(!text) return;

  const u = new SpeechSynthesisUtterance(text);
  u.lang = "ko-KR";
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

function openWordModal(){
  document.getElementById("addWordModal").classList.add("show");
  syncNewWordSubtype();
}

function closeWordModal(){
  document.getElementById("addWordModal").classList.remove("show");
}

function syncNewWordSubtype(){
  const type = document.getElementById("newType").value;
  document.getElementById("newNounSubTypeField").style.display = type === "noun" ? "block" : "none";
}

function addWord(){
  const kr = document.getElementById("newKr").value.trim();
  const jp = document.getElementById("newJp").value.trim();
  const roman = document.getElementById("newRoman").value.trim();
  const kana = document.getElementById("newKana").value.trim();
  const type = document.getElementById("newType").value;
  const subType = document.getElementById("newSubType").value;

  if(!kr || !jp){
    alert("韓国語と日本語は必須です。");
    return;
  }

  const item = { kr,jp,roman,kana,type };
  if(type === "noun") item.subType = subType;

  state.customWords.push(item);

  closeWordModal();
  renderWords();
  renderStats();
  saveState();

  document.getElementById("newKr").value = "";
  document.getElementById("newJp").value = "";
  document.getElementById("newRoman").value = "";
  document.getElementById("newKana").value = "";
}

function openPhraseModal(){
  const select = document.getElementById("newPhraseCategory");

  select.innerHTML = Object.entries(PHRASE_TYPES).map(([key,label])=>`
    <option value="${key}">${label}</option>
  `).join("");

  select.value = state.currentPhraseCategory;
  document.getElementById("newPhraseStyle").value = state.phraseStyle;
  document.getElementById("addPhraseModal").classList.add("show");
}

function closePhraseModal(){
  document.getElementById("addPhraseModal").classList.remove("show");
}

function addPhrase(){
  const category = document.getElementById("newPhraseCategory").value;
  const style = document.getElementById("newPhraseStyle").value;
  const kr = document.getElementById("newPhraseKr").value.trim();
  const jp = document.getElementById("newPhraseJp").value.trim();
  const roman = document.getElementById("newPhraseRoman").value.trim();
  const kana = document.getElementById("newPhraseKana").value.trim();

  if(!kr || !jp){
    alert("韓国語と日本語は必須です。");
    return;
  }

  if(!state.customPhrases[category]){
    state.customPhrases[category] = [];
  }

  state.customPhrases[category].push({ style, kr, jp, roman, kana });
  state.currentPhraseCategory = category;
  state.phraseStyle = style;

  closePhraseModal();
  renderTopBars();
  renderPhrase();
  saveState();

  document.getElementById("newPhraseKr").value = "";
  document.getElementById("newPhraseJp").value = "";
  document.getElementById("newPhraseRoman").value = "";
  document.getElementById("newPhraseKana").value = "";
}

function openSettings(){
  document.getElementById("settingsBackdrop").classList.add("show");
  document.getElementById("settingsPanel").classList.add("show");
  renderSelectedButtons();
}

function closeSettings(){
  document.getElementById("settingsBackdrop").classList.remove("show");
  document.getElementById("settingsPanel").classList.remove("show");
}

function clearCache(){
  if(!confirm("保存データを削除しますか？")) return;

  [
    STORAGE_KEY,
    CUSTOM_WORDS_KEY,
    CUSTOM_PHRASES_KEY,
    GACHA_WORDS_KEY,
    SAVED_SENTENCES_KEY,
    WRONG_WORDS_KEY,
    MARKS_KEY
  ].forEach(k=>localStorage.removeItem(k));

  location.reload();
}

function bindEvents(){
  document.querySelectorAll(".tab-btn").forEach(btn=>{
    btn.addEventListener("click",()=>switchTab(btn.dataset.tab));
  });

  document.getElementById("leftFilter").addEventListener("click",e=>{
    const open = e.target.closest("#typeOpenBtn");
    const collapse = e.target.closest("[data-collapse-type]");
    const type = e.target.closest("[data-word-type]");
    const phrase = e.target.closest("[data-phrase-type]");
    const quizOpen = e.target.closest("#quizTypeOpenBtn");
    const quizCollapse = e.target.closest("[data-collapse-quiz-type]");
    const quizType = e.target.closest("[data-quiz-type]");

    if(open){
      state.typeExpanded = true;
      renderTopBars();
      return;
    }

    if(collapse){
      state.typeExpanded = false;
      renderTopBars();
      return;
    }

    if(type){
      state.wordType = type.dataset.wordType;
      state.typeExpanded = false;

      if(state.wordType !== "noun"){
        state.nounSubType = "all";
      }

      renderTopBars();
      renderWords();
      renderStats();
      saveState();
      return;
    }

    if(phrase){
      state.currentPhraseCategory = phrase.dataset.phraseType;
      renderTopBars();
      renderPhrase();
      saveState();
      return;
    }

    if(quizOpen){
      state.quizTypeExpanded = true;
      renderTopBars();
      return;
    }

    if(quizCollapse){
      state.quizTypeExpanded = false;
      renderTopBars();
      return;
    }

    if(quizType){
      state.quizType = quizType.dataset.quizType;
      state.quizTypeExpanded = false;
      renderTopBars();
      showQuizStart("normal");
      saveState();
      return;
    }
  });

  document.getElementById("rightFilter").addEventListener("click",e=>{
    const btn = e.target.closest("[data-status]");
    if(!btn) return;

    const status = btn.dataset.status;

    if(state.wordStatus === status){
      state.wordStatus = "all";
    }else{
      state.wordStatus = status;
    }

    renderTopBars();
    renderWords();
    saveState();
  });

  document.getElementById("nounSubRow").addEventListener("click",e=>{
    const btn = e.target.closest("[data-noun-sub]");
    if(!btn) return;

    state.nounSubType = btn.dataset.nounSub;
    renderTopBars();
    renderWords();
    saveState();
  });

  document.getElementById("styleRow").addEventListener("click",e=>{
    const randomBtn = e.target.closest("[data-style]");
    const phraseBtn = e.target.closest("[data-phrase-style]");

    if(randomBtn){
      state.randomStyle = randomBtn.dataset.style;
      renderTopBars();
      saveState();
      return;
    }

    if(phraseBtn){
      state.phraseStyle = phraseBtn.dataset.phraseStyle;
      renderTopBars();
      renderPhrase();
      saveState();
      return;
    }
  });

  document.getElementById("wordList").addEventListener("click",e=>{
    const audio = e.target.closest(".audio-btn");
    const good = e.target.closest("[data-mark-good]");
    const bad = e.target.closest("[data-mark-bad]");
    const card = e.target.closest(".word-card");

    if(audio){
      e.stopPropagation();
      speakText(audio.dataset.audio);
      return;
    }

    if(good){
      e.stopPropagation();
      const kr = good.dataset.markGood;
      state.marks[kr] = state.marks[kr] === "good" ? "" : "good";
      if(!state.marks[kr]) delete state.marks[kr];
      renderWords();
      saveState();
      return;
    }

    if(bad){
      e.stopPropagation();
      const kr = bad.dataset.markBad;
      state.marks[kr] = state.marks[kr] === "bad" ? "" : "bad";
      if(!state.marks[kr]) delete state.marks[kr];
      renderWords();
      saveState();
      return;
    }

    if(card){
      card.classList.toggle("show");
    }
  });

  document.getElementById("phrasePanel").addEventListener("click",e=>{
    const audio = e.target.closest(".phrase-audio-btn");

    if(audio){
      e.stopPropagation();
      speakText(audio.dataset.audio);
      return;
    }

    const card = e.target.closest(".phrase-card");
    if(card) card.classList.toggle("show");
  });

  document.getElementById("sentenceBoard").addEventListener("click",()=>{
    document.getElementById("sentenceBoard").classList.toggle("show");
  });

  document.getElementById("randomSentenceBtn").addEventListener("click",()=>{
    const pool = RANDOM_SENTENCES.filter(s=>s.style === state.randomStyle);
    const item = pickRandom(pool.length ? pool : RANDOM_SENTENCES);

    state.sentence = item.kr;
    state.sentenceJp = item.jp;

    document.getElementById("sentenceBoard").classList.remove("show");

    renderSentence();
    saveState();
  });

  document.getElementById("saveSentenceBtn").addEventListener("click",()=>{
    if(!state.sentence) return;

    if(!state.savedSentences.some(s=>s.kr === state.sentence)){
      state.savedSentences.unshift({
        kr:state.sentence,
        jp:state.sentenceJp
      });
    }

    renderSavedSentences();
    saveState();
  });

  document.getElementById("speakSentenceBtn").addEventListener("click",()=>speakText(state.sentence));

  document.getElementById("selectNormalQuizBtn").addEventListener("click",()=>{
    state.quizTypeBarVisible = true;
    state.quizTypeExpanded = false;
    renderTopBars();
    showQuizStart("normal");
    saveState();
  });

  document.getElementById("selectEndlessQuizBtn").addEventListener("click",()=>{
    state.quizTypeBarVisible = false;
    state.quizTypeExpanded = false;
    renderTopBars();
    showQuizStart("endless");
    saveState();
  });

  document.getElementById("endEndlessBtn").addEventListener("click",finishEndless);

  document.getElementById("quizBox").addEventListener("click",e=>{
    const btn = e.target.closest(".answer-btn");
    if(btn) handleQuizAnswer(btn.dataset.answer);
  });

  document.getElementById("gachaOneBtn").addEventListener("click",()=>gachaPull(1));
  document.getElementById("gachaTenBtn").addEventListener("click",()=>gachaPull(10));

  document.getElementById("fabBtn").addEventListener("click",()=>{
    if(state.currentTab === "word") openWordModal();
    if(state.currentTab === "phrase") openPhraseModal();
  });

  document.getElementById("newType").addEventListener("change",syncNewWordSubtype);
  document.getElementById("cancelAddWordBtn").addEventListener("click",closeWordModal);
  document.getElementById("submitAddWordBtn").addEventListener("click",addWord);

  document.getElementById("cancelAddPhraseBtn").addEventListener("click",closePhraseModal);
  document.getElementById("submitAddPhraseBtn").addEventListener("click",addPhrase);

  document.getElementById("settingsBtn").addEventListener("click",openSettings);
  document.getElementById("settingsBackdrop").addEventListener("click",closeSettings);
  document.getElementById("closeSettingsBtn").addEventListener("click",closeSettings);

  document.getElementById("bgNavyBtn").addEventListener("click",()=>{
    state.bgMode = "navy";
    if(state.quiz.mode !== "endless") applyTheme();
    renderSelectedButtons();
    saveState();
  });

  document.getElementById("bgBeigeBtn").addEventListener("click",()=>{
    state.bgMode = "beige";
    if(state.quiz.mode !== "endless") applyTheme();
    renderSelectedButtons();
    saveState();
  });

  document.getElementById("pronRomanBtn").addEventListener("click",()=>{
    state.pronMode = "roman";
    renderWords();
    renderPhrase();
    renderWrongWords();
    renderSelectedButtons();
    saveState();
  });

  document.getElementById("pronKanaBtn").addEventListener("click",()=>{
    state.pronMode = "kana";
    renderWords();
    renderPhrase();
    renderWrongWords();
    renderSelectedButtons();
    saveState();
  });

  document.getElementById("clearCacheBtn").addEventListener("click",clearCache);
}

function activateCurrentTab(){
  document.querySelectorAll(".tab-btn").forEach(btn=>{
    btn.classList.toggle("active", btn.dataset.tab === state.currentTab);
  });

  document.querySelectorAll(".screen").forEach(screen=>{
    screen.classList.remove("active");
  });

  const screen = document.getElementById(`screen-${state.currentTab}`);

  if(screen){
    screen.classList.add("active");
  }else{
    state.currentTab = "word";
    document.getElementById("screen-word").classList.add("active");
  }
}

function init(){
  loadState();
  applyTheme();
  bindEvents();
  activateCurrentTab();
  renderTopBars();
  renderFab();
  renderWords();
  renderPhrase();
  renderSentence();
  renderSavedSentences();
  renderWrongWords();
  renderStats();
  renderSelectedButtons();
  syncNewWordSubtype();
}

init();
</script>
