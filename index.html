<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="manifest.json" />
  <title>KoreanMaster</title>

  <style>
    :root{
      --bg:#f6f0dd;
      --navy:#0d1b2a;
      --navy-soft:#1b263b;
      --navy-soft-2:#24364f;
      --white:#ffffff;
      --shadow:rgba(13,27,42,0.18);

      --noun-color:#ffdce7;
      --verb-color:#d9ecff;
      --adj-color:#ddf6dd;
      --adv-color:#fff0d8;
      --conj-color:#eadcff;
      --react-color:#ffe7d4;
      --time-color:#e0f7f3;
      --phrase-color:#ffffff;

      --person-tag:#ffb8cf;
      --food-tag:#ffd59e;
      --place-tag:#b5e3ff;
      --thing-tag:#d3c4ff;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Sans",
        "Yu Gothic",
        "Noto Sans JP",
        sans-serif;
      background:var(--bg);
      color:var(--navy);
    }

    .app{
      max-width:720px;
      margin:0 auto;
      min-height:100vh;
      padding-bottom:88px;
    }

    /* ===== 上ヘッダー ===== */
    .topbar{
      background:var(--navy);
      color:var(--white);
      height:64px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 16px;
      position:sticky;
      top:0;
      z-index:40;
      box-shadow:0 4px 14px rgba(0,0,0,0.16);
    }

    .brand-wrap{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }

    .logo{
      height:36px;
      width:auto;
      display:block;
      flex-shrink:0;
    }

    .brand{
      font-size:22px;
      font-weight:800;
      letter-spacing:0.3px;
      white-space:nowrap;
    }

    .menu-btn{
      border:none;
      background:transparent;
      color:var(--white);
      font-size:22px;
      cursor:pointer;
      padding:6px 10px;
      border-radius:10px;
    }

    .menu-btn:active{
      transform:scale(0.98);
    }

    /* ===== カテゴリバー ===== */
    .subbar{
      background:var(--navy-soft);
      padding:10px 10px;
      overflow-x:auto;
      white-space:nowrap;
      position:sticky;
      top:64px;
      z-index:35;
      box-shadow:0 4px 10px rgba(0,0,0,0.08);
    }

    .scroll-row{
      display:flex;
      gap:8px;
      min-width:max-content;
    }

    .chip{
      border:none;
      background:rgba(255,255,255,0.08);
      color:var(--white);
      border-radius:999px;
      padding:10px 14px;
      font-size:14px;
      cursor:pointer;
      white-space:nowrap;
      transition:all .18s ease;
    }

    .chip.active{
      background:var(--white);
      color:var(--navy);
      font-weight:700;
    }

    .chip.subchip{
      background:rgba(255,255,255,0.08);
      color:var(--white);
    }

    .chip.subchip.active{
      background:#fff;
      color:var(--navy);
    }

    /* ===== 汎用ボタン群 ===== */
    .toolbar{
      display:flex;
      gap:8px;
      padding:14px 14px 8px;
      flex-wrap:wrap;
    }

    .action-btn{
      border:none;
      background:var(--navy);
      color:#fff;
      border-radius:12px;
      padding:10px 14px;
      font-size:14px;
      cursor:pointer;
      box-shadow:0 4px 0 rgba(13,27,42,0.24);
    }

    .action-btn.secondary{
      background:var(--navy-soft-2);
    }

    .action-btn.light{
      background:#fff;
      color:var(--navy);
      border:2px solid var(--navy-soft);
      box-shadow:none;
    }

    /* ===== 画面切り替え ===== */
    .screen{
      display:none;
      padding:10px 14px 18px;
    }

    .screen.active{
      display:block;
    }

    .section-title{
      font-size:18px;
      font-weight:800;
      margin:8px 0 12px;
    }

    .muted{
      color:#5a6473;
      font-size:13px;
      line-height:1.6;
    }

    /* ===== 単語カード ===== */
    .card-list{
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .word-card{
      border-radius:18px;
      padding:14px 14px;
      background:#fff;
      box-shadow:0 8px 18px var(--shadow);
      cursor:pointer;
      user-select:none;
      transition:transform .16s ease, box-shadow .16s ease;
      position:relative;
      overflow:hidden;
      border:1px solid rgba(13,27,42,0.05);
    }

    .word-card:active{
      transform:scale(0.992);
    }

    .word-card.noun{ background:var(--noun-color); }
    .word-card.verb{ background:var(--verb-color); }
    .word-card.adj{ background:var(--adj-color); }
    .word-card.adv{ background:var(--adv-color); }
    .word-card.conj{ background:var(--conj-color); }
    .word-card.react{ background:var(--react-color); }
    .word-card.time{ background:var(--time-color); }

    .word-card .top-row{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
    }

    .card-left{
      flex:1;
      min-width:0;
    }

    .kr{
      font-size:24px;
      font-weight:800;
      line-height:1.2;
      margin-bottom:4px;
      word-break:break-all;
    }

    .kana{
      font-size:13px;
      color:#666;
      margin-bottom:6px;
      line-height:1.4;
    }

    .jp{
      display:none;
      font-size:15px;
      color:#334;
      line-height:1.5;
      margin-top:8px;
    }

    .word-card.show-answer .jp{
      display:block;
    }

    .tag-row{
      display:flex;
      gap:6px;
      flex-wrap:wrap;
      margin-top:4px;
    }

    .tag{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      font-size:12px;
      font-weight:700;
      border-radius:999px;
      padding:4px 10px;
      color:#213;
      background:rgba(255,255,255,0.7);
      border:1px solid rgba(13,27,42,0.06);
    }

    .tag.person{ background:var(--person-tag); }
    .tag.food{ background:var(--food-tag); }
    .tag.place{ background:var(--place-tag); }
    .tag.thing{ background:var(--thing-tag); }

    .audio-btn{
      border:none;
      width:44px;
      height:44px;
      border-radius:12px;
      background:var(--navy);
      color:#fff;
      cursor:pointer;
      font-size:18px;
      flex-shrink:0;
      box-shadow:0 4px 0 rgba(13,27,42,0.22);
    }

    /* ===== 文章生成ボード ===== */
    .sentence-board{
      margin-top:4px;
      background:#fff;
      border-radius:18px;
      padding:16px;
      box-shadow:0 8px 18px var(--shadow);
      min-height:110px;
    }

    .sentence-title{
      font-size:13px;
      color:#5f6774;
      margin-bottom:8px;
      font-weight:700;
    }

    .sentence-text{
      font-size:22px;
      font-weight:800;
      line-height:1.5;
      white-space:pre-line;
    }

    .sentence-sub{
      margin-top:8px;
      color:#4b5563;
      font-size:14px;
      line-height:1.6;
      white-space:pre-line;
    }

    /* ===== フレーズ ===== */
    .phrase-grid{
      display:grid;
      grid-template-columns:1fr;
      gap:12px;
    }

    .phrase-btn{
      border:none;
      background:var(--phrase-color);
      color:var(--navy);
      border-radius:16px;
      padding:16px;
      font-size:16px;
      font-weight:800;
      text-align:left;
      cursor:pointer;
      box-shadow:0 8px 18px var(--shadow);
    }

    .phrase-panel{
      margin-top:14px;
      background:transparent;
      border-radius:18px;
      padding:0;
    }

    .phrase-list{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .phrase-item{
      background:#fff;
      border:1px solid #e4e8ef;
      border-radius:14px;
      padding:14px;
      box-shadow:none;
      cursor:pointer;
    }

    .phrase-item-top{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:10px;
    }

    .phrase-text{
      flex:1;
      min-width:0;
    }

    .phrase-kr{
      font-size:18px;
      font-weight:800;
      margin-bottom:4px;
      word-break:break-word;
    }

    .phrase-kana{
      font-size:13px;
      color:#666;
      margin-bottom:6px;
      line-height:1.4;
    }

    .phrase-jp{
      display:none;
      color:#4b5563;
      line-height:1.5;
      font-size:14px;
      margin-top:6px;
    }

    .phrase-item.show .phrase-jp{
      display:block;
    }

    /* ===== クイズ ===== */
    .quiz-box{
      background:#fff;
      border-radius:18px;
      padding:16px;
      box-shadow:0 8px 18px var(--shadow);
    }

    .quiz-progress{
      font-size:13px;
      color:#54606d;
      margin-bottom:8px;
      font-weight:700;
    }

    .quiz-question{
      font-size:24px;
      font-weight:800;
      margin-bottom:14px;
    }

    .answers{
      display:grid;
      gap:10px;
    }

    .answer-btn{
      border:none;
      background:#eef2f9;
      color:var(--navy);
      border-radius:14px;
      padding:14px;
      text-align:left;
      font-size:15px;
      font-weight:700;
      cursor:pointer;
    }

    .quiz-result{
      margin-top:14px;
      background:#f4f7fb;
      border-radius:14px;
      padding:12px;
      color:#334155;
      line-height:1.6;
      font-size:14px;
    }

    /* ===== ガチャ ===== */
    .gacha-box{
      background:#fff;
      border-radius:18px;
      padding:16px;
      box-shadow:0 8px 18px var(--shadow);
    }

    .gacha-stage{
      height:180px;
      border:2px dashed #cfd8e5;
      border-radius:18px;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      color:#5c6675;
      background:linear-gradient(180deg,#fbfcff,#f1f5fb);
      margin-bottom:14px;
      padding:10px;
    }

    .coin-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:12px;
      flex-wrap:wrap;
    }

    .coin-badge{
      background:var(--navy);
      color:#fff;
      padding:10px 14px;
      border-radius:999px;
      font-weight:800;
      font-size:14px;
    }

    .gacha-actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .gacha-log{
      margin-top:14px;
      background:#f7f9fd;
      border-radius:16px;
      padding:12px;
      min-height:120px;
    }

    .gacha-item{
      padding:10px 0;
      border-bottom:1px solid #e7ebf3;
      line-height:1.5;
      font-size:14px;
    }

    .gacha-item:last-child{
      border-bottom:none;
    }

    .stats-box{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:10px;
      margin-top:12px;
    }

    .stat{
      background:#fff;
      border-radius:16px;
      padding:14px;
      box-shadow:0 8px 18px var(--shadow);
    }

    .stat-label{
      font-size:12px;
      color:#637083;
      margin-bottom:4px;
      font-weight:700;
    }

    .stat-value{
      font-size:22px;
      font-weight:800;
    }

    /* ===== 下タブ ===== */
    .bottom-nav{
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      background:var(--navy);
      display:flex;
      box-shadow:0 -6px 18px rgba(0,0,0,0.16);
      z-index:50;
    }

    .tab-btn{
      flex:1;
      border:none;
      background:transparent;
      color:#fff;
      padding:14px 8px 18px;
      font-size:14px;
      font-weight:800;
      cursor:pointer;
      opacity:0.72;
    }

    .tab-btn.active{
      opacity:1;
      background:rgba(255,255,255,0.06);
    }

    .empty{
      background:#fff;
      border-radius:18px;
      padding:18px;
      box-shadow:0 8px 18px var(--shadow);
      color:#526072;
      line-height:1.6;
    }

    @media (min-width: 768px){
      .phrase-grid{
        grid-template-columns:1fr 1fr;
      }

      .stats-box{
        grid-template-columns:repeat(4,1fr);
      }
    }
  </style>
</head>

<body>
  <div class="app">

    <!-- 上ヘッダー -->
    <header class="topbar">
      <div class="brand-wrap">
        <img src="logo.png" class="logo" alt="logo">
        <div class="brand">KoreanMaster</div>
      </div>
      <button class="menu-btn" id="resetBtn">≡</button>
    </header>

    <!-- メインカテゴリ -->
    <div class="subbar" id="mainCategoryBar">
      <div class="scroll-row">
        <button class="chip active" data-main-category="all">すべて</button>
        <button class="chip" data-main-category="noun">名詞</button>
        <button class="chip" data-main-category="verb">動詞</button>
        <button class="chip" data-main-category="adj">形容詞</button>
        <button class="chip" data-main-category="adv">副詞</button>
        <button class="chip" data-main-category="conj">接続詞</button>
        <button class="chip" data-main-category="react">リアクション</button>
        <button class="chip" data-main-category="time">時間</button>
      </div>
    </div>

    <!-- 名詞サブカテゴリ -->
    <div class="subbar" id="nounSubBar" style="display:none;">
      <div class="scroll-row">
        <button class="chip subchip active" data-sub-category="all">名詞すべて</button>
        <button class="chip subchip" data-sub-category="person">人</button>
        <button class="chip subchip" data-sub-category="food">食べ物</button>
        <button class="chip subchip" data-sub-category="place">場所</button>
        <button class="chip subchip" data-sub-category="thing">物</button>
      </div>
    </div>

    <!-- 単語帳 -->
    <section class="screen active" id="screen-word">
      <div class="toolbar">
        <button class="action-btn" id="toggleMeaningBtn">意味を全表示 / 全非表示</button>
        <button class="action-btn secondary" id="randomSentenceBtn">ランダム文章作成</button>
        <button class="action-btn light" id="speakSentenceBtn">文章を読み上げ</button>
      </div>

      <div class="sentence-board">
        <div class="sentence-title">ランダム文章</div>
        <div class="sentence-text" id="sentenceText">ボタンを押すとここに文章が出ます</div>
        <div class="sentence-sub" id="sentenceSub">名詞（人）＋助詞＋名詞（食べ物 / 物 / 場所）＋助詞＋動詞 の形で生成します。</div>
      </div>

      <div class="section-title">単語帳</div>
      <div class="card-list" id="wordList"></div>
    </section>

    <!-- フレーズ -->
    <section class="screen" id="screen-phrase">
      <div class="section-title">場面ごとの便利フレーズ</div>

      <div class="phrase-grid">
        <button class="phrase-btn" data-phrase-group="greeting">挨拶</button>
        <button class="phrase-btn" data-phrase-group="emotion">感情</button>
        <button class="phrase-btn" data-phrase-group="instruction">指示</button>
        <button class="phrase-btn" data-phrase-group="slang">スラング</button>
        <button class="phrase-btn" data-phrase-group="game">ゲーム</button>
        <button class="phrase-btn" data-phrase-group="affirm">肯定</button>
        <button class="phrase-btn" data-phrase-group="negative">否定</button>
        <button class="phrase-btn" data-phrase-group="request">要望</button>
      </div>

      <div class="phrase-panel" id="phrasePanel">
        <div class="muted">上のボタンを押すとフレーズ一覧が表示されます。</div>
      </div>
    </section>

    <!-- クイズ -->
    <section class="screen" id="screen-quiz">
      <div class="section-title">4択クイズ</div>
      <div class="toolbar">
        <button class="action-btn" id="startQuizBtn">10問クイズ開始</button>
      </div>

      <div class="quiz-box" id="quizBox">
        <div class="muted">
          現在のカテゴリに応じてクイズを出します。<br />
          10問終わると結果が表示されます。全問正解で1000コイン獲得です。
        </div>
      </div>
    </section>

    <!-- ガチャ -->
    <section class="screen" id="screen-gacha">
      <div class="section-title">ガチャ</div>

      <div class="gacha-box">
        <div class="coin-row">
          <div class="coin-badge">コイン: <span id="coinDisplay">0</span></div>
          <div class="muted">1回 500コイン / 10連 5000コイン</div>
        </div>

        <div class="gacha-stage" id="gachaStage">
          固有名詞・スラング寄り表現などを入れる箱。<br />
          引いた単語はこのブラウザに保存されます。
        </div>

        <div class="gacha-actions">
          <button class="action-btn" id="gachaOneBtn">1回引く</button>
          <button class="action-btn secondary" id="gachaTenBtn">10連引く</button>
        </div>

        <div class="gacha-log" id="gachaLog"></div>
      </div>

      <div class="stats-box">
        <div class="stat">
          <div class="stat-label">所持単語数</div>
          <div class="stat-value" id="statWordCount">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">獲得ガチャ語</div>
          <div class="stat-value" id="statGachaCount">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">クイズ最高点</div>
          <div class="stat-value" id="statBestScore">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">現在カテゴリ</div>
          <div class="stat-value" id="statCurrentCategory">all</div>
        </div>
      </div>
    </section>

    <!-- 下タブ -->
    <nav class="bottom-nav">
      <button class="tab-btn active" data-tab="word">単語帳</button>
      <button class="tab-btn" data-tab="phrase">フレーズ</button>
      <button class="tab-btn" data-tab="quiz">クイズ</button>
      <button class="tab-btn" data-tab="gacha">ガチャ</button>
    </nav>
  </div>

    function loadState(){
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return;

      try{
        const parsed = JSON.parse(raw);
        state.currentTab = parsed.currentTab ?? "word";
        state.currentMainCategory = parsed.currentMainCategory ?? "all";
        state.currentSubCategory = parsed.currentSubCategory ?? "all";
        state.showAllMeanings = parsed.showAllMeanings ?? false;
        state.coin = parsed.coin ?? 1000;
        state.gachaOwned = Array.isArray(parsed.gachaOwned) ? parsed.gachaOwned : [];
        state.bestScore = parsed.bestScore ?? 0;
        state.sentence = parsed.sentence ?? "";

      }catch(err){

    /************************************************************
     * 9) 分類
     ************************************************************/
    function classifyWord(item){
      const word = item.kr;

      if(TIME_SET.has(word)){
        return { type:"time", subType:null };
      }

      if(ADVERB_SET.has(word)){
        return { type:"adv", subType:null };
      }

      if(CONJUNCTION_SET.has(word)){
        return { type:"conj", subType:null };
      }

      if(REACTION_SET.has(word)){
        return { type:"react", subType:null };
      }

      if(word.endsWith("다")){
        if(ADJECTIVE_SET.has(word)){
          return { type:"adj", subType:null };
        }
        return { type:"verb", subType:null };
      }

      return {
        type:"noun",
        subType: classifyNounSubType(word)
      };
    }

    function classifyNounSubType(word){
      if(NOUN_SUBTYPE_DB.person.has(word)) return "person";
      if(NOUN_SUBTYPE_DB.food.has(word)) return "food";
      if(NOUN_SUBTYPE_DB.place.has(word)) return "place";
      return "thing";
    }

    function buildClassifiedDatabase(rawWords){
      const db = {
        noun: {
          person: [],
          food: [],
          place: [],
          thing: []
        },
        verb: [],
        adj: [],
        adv: [],
        conj: [],
        react: [],
        time: []
      };

      rawWords.forEach(item => {
        const result = classifyWord(item);

        const fullItem = {
          kr: item.kr,
          jp: item.jp,
          kana: item.kana || "",
          type: result.type,
          subType: result.subType
        };

        if(result.type === "noun"){
          db.noun[result.subType].push(fullItem);
        }else{
          db[result.type].push(fullItem);
        }
      });

      return db;
    }

    /************************************************************
     * 10) ヘルパー
     ************************************************************/
    function getAllWordsFlat(){
      const db = state.classified;
      return [
        ...db.noun.person,
        ...db.noun.food,
        ...db.noun.place,
        ...db.noun.thing,
        ...db.verb,
        ...db.adj,
        ...db.adv,
        ...db.conj,
        ...db.react,
        ...db.time
      ];
    }

    function getVisibleWords(){
      const db = state.classified;
      const cat = state.currentMainCategory;
      const sub = state.currentSubCategory;

      if(cat === "all"){
        return getAllWordsFlat();
      }

      if(cat === "noun"){
        if(sub === "all"){
          return [
            ...db.noun.person,
            ...db.noun.food,
            ...db.noun.place,
            ...db.noun.thing
          ];
        }
        return db.noun[sub] ?? [];
      }

      return db[cat] ?? [];
    }

    function shuffle(arr){
      const cloned = [...arr];
      for(let i = cloned.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [cloned[i], cloned[j]] = [cloned[j], cloned[i]];
      }
      return cloned;
    }

    function pickRandom(arr){
      if(!arr || !arr.length) return null;
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function toJapaneseType(type){
      const map = {
        noun:"名詞",
        verb:"動詞",
        adj:"形容詞",
        adv:"副詞",
        conj:"接続詞",
        react:"リアクション",
        time:"時間"
      };
      return map[type] ?? type;
    }

    function toJapaneseSubtype(subType){
      const map = {
        person:"人",
        food:"食べ物",
        place:"場所",
        thing:"物"
      };
      return map[subType] ?? subType;
    }

    function escapeHtml(str){
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

          ? `<span class="tag ${item.subType}">${toJapaneseSubtype(item.subType)}</span>`

    /************************************************************
     * 12) 文章生成
     ************************************************************/
    function makeRandomSentence(){
      const db = state.classified;

      const subject = pickRandom(db.noun.person);
      const object = pickRandom([
        ...db.noun.food,
        ...db.noun.place,
        ...db.noun.thing
      ]);
      const verb = pickRandom(db.verb);

      if(!subject || !object || !verb){
        state.sentence = "文章生成に必要な単語が足りません";
        state.sentenceMeaning = "";
        renderSentenceBoard();
        return;
      }

      const p1 = pickRandom(SUBJECT_PARTICLES);
      const p2 = pickRandom(OBJECT_PARTICLES);
      const v = convertVerbToHaeyotai(verb.kr);

      state.sentence = `${subject.kr}${p1} ${object.kr}${p2} ${v}`;
      state.sentenceMeaning =
        `${subject.jp}（${PARTICLE_MEANING[p1]}）${object.jp}（${PARTICLE_MEANING[p2]}）${verb.jp}`;

      renderSentenceBoard();
      saveState();
    }

    function convertVerbToHaeyotai(verbDictForm){
      if(!verbDictForm.endsWith("다")) return verbDictForm;

      if(verbDictForm === "가다") return "가요";
      if(verbDictForm === "오다") return "와요";
      if(verbDictForm === "보다") return "봐요";
      if(verbDictForm === "먹다") return "먹어요";
      if(verbDictForm === "마시다") return "마셔요";
      if(verbDictForm === "말하다") return "말해요";
      if(verbDictForm === "공부하다") return "공부해요";
      if(verbDictForm === "기다리다") return "기다려요";
      if(verbDictForm === "가르치다") return "가르쳐요";
      if(verbDictForm === "만나다") return "만나요";
      if(verbDictForm === "좋아하다") return "좋아해요";
      if(verbDictForm === "걷다") return "걸어요";
      if(verbDictForm === "자다") return "자요";

      const stem = verbDictForm.slice(0, -1);
      if(stem.endsWith("하")) return stem + "요";
      return stem + "요";
    }

    function renderSentenceBoard(){
      document.getElementById("sentenceText").textContent =
        state.sentence || "ボタンを押すとここに文章が出ます";

      document.getElementById("sentenceSub").textContent =

    /************************************************************
     * 14) クイズ
     ************************************************************/
    function startQuiz(){
      const pool = getVisibleWords();

      if(pool.length < 4){
        document.getElementById("quizBox").innerHTML = `
          <div class="empty">
            クイズを開始するには、現在のカテゴリに4語以上必要です。
          </div>
        `;
        return;
      }

      const items = shuffle(pool).slice(0, 10);
      state.quiz.inProgress = true;
      state.quiz.items = items;
      state.quiz.index = 0;
      state.quiz.score = 0;
      renderQuizQuestion();
    }

    function renderQuizQuestion(){
      const { items, index, score } = state.quiz;
      const total = items.length;
      const current = items[index];

      if(!current){
        finishQuiz();
        return;
      }

      const pool = getVisibleWords();
      const wrongChoices = shuffle(
        pool.filter(item => item.kr !== current.kr)
      ).slice(0, 3);

      const choices = shuffle([current, ...wrongChoices]);

      document.getElementById("quizBox").innerHTML = `
        <div class="quiz-progress">問題 ${index + 1} / ${total} ・ 現在 ${score}点</div>
        <div class="quiz-question">${escapeHtml(current.kr)} の意味は？</div>
        <div class="answers">
          ${choices.map(choice => `
            <button class="answer-btn" data-answer="${escapeHtml(choice.jp)}">
              ${escapeHtml(choice.jp)}
            </button>
          `).join("")}
        </div>
        <div class="quiz-result">4択です。全問正解すると1000コインもらえます。</div>
      `;
    }

    function handleQuizAnswer(selected){
      const current = state.quiz.items[state.quiz.index];
      if(!current) return;

      if(selected === current.jp){
        state.quiz.score += 1;
      }

      state.quiz.index += 1;

      if(state.quiz.index >= state.quiz.items.length){
        finishQuiz();
      }else{
        renderQuizQuestion();
      }
    }

    function finishQuiz(){
      const score = state.quiz.score;
      const total = state.quiz.items.length;

      if(score === total && total > 0){
        state.coin += 1000;
      }

      if(score > state.bestScore){
        state.bestScore = score;
      }

      state.quiz.inProgress = false;
      saveState();
      renderStats();
      renderCoin();

      document.getElementById("quizBox").innerHTML = `
        <div class="quiz-progress">クイズ終了</div>
        <div class="quiz-question">${score} / ${total}</div>
        <div class="quiz-result">
          ${score === total ? "全問正解！ 1000コイン獲得。" : "今回は全問正解ではありません。"}
          <br />
          もう一度挑戦できます。
        </div>
      `;
    }

    /************************************************************
     * 15) ガチャ
     ************************************************************/
    function gachaPull(times){
      const cost = times === 10 ? 5000 : 500;

      if(state.coin < cost){
        document.getElementById("gachaStage").textContent =
          "コイン不足です。クイズで増やしてください。";
        return;
      }

      state.coin -= cost;

      const results = [];
      for(let i = 0; i < times; i++){
        const item = pickRandom(GACHA_POOL);
        if(item){
          results.push(item);
          state.gachaOwned.push(item);
        }
      }

      renderCoin();
      renderStats();
      saveState();

      document.getElementById("gachaStage").innerHTML = results.map(item => {
        return `<div><strong>[${escapeHtml(item.rarity)}]</strong> ${escapeHtml(item.kr)} - ${escapeHtml(item.jp)}</div>`;
      }).join("");

      const log = document.getElementById("gachaLog");
      log.innerHTML = results.map(item => `
        <div class="gacha-item">
          [${escapeHtml(item.rarity)}] ${escapeHtml(item.kr)} - ${escapeHtml(item.jp)}
        </div>
      `).join("");
    }

    /************************************************************
     * 16) 音声
     ************************************************************/
    function speakText(text){
      if(!text) return;
      const uttr = new SpeechSynthesisUtterance(text);
      uttr.lang = "ko-KR";
      speechSynthesis.cancel();
      speechSynthesis.speak(uttr);
    }

    /************************************************************
     * 17) 表示系
     ************************************************************/
    function renderCoin(){
      document.getElementById("coinDisplay").textContent = state.coin;
    }

    function renderStats(){
      document.getElementById("statWordCount").textContent = RAW_WORDS.length;
      document.getElementById("statGachaCount").textContent = state.gachaOwned.length;
      document.getElementById("statBestScore").textContent = state.bestScore;
      document.getElementById("statCurrentCategory").textContent = state.currentMainCategory;
    }

    function switchTab(tab){
      state.currentTab = tab;
      saveState();

      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.tab === tab);
      });

      document.querySelectorAll(".screen").forEach(screen => {
        screen.classList.remove("active");
      });

      const target = document.getElementById(`screen-${tab}`);
      if(target){
        target.classList.add("active");
      }
    }

    function syncCategoryBars(){
      document.querySelectorAll("[data-main-category]").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.mainCategory === state.currentMainCategory);
      });

      document.querySelectorAll("[data-sub-category]").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.subCategory === state.currentSubCategory);
      });

      document.getElementById("nounSubBar").style.display =
        state.currentMainCategory === "noun" ? "block" : "none";
    }

    /************************************************************
     * 18) イベント登録
     ************************************************************/
    function bindEvents(){
      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          switchTab(btn.dataset.tab);
        });
      });

      document.querySelectorAll("[data-main-category]").forEach(btn => {
        btn.addEventListener("click", () => {
          state.currentMainCategory = btn.dataset.mainCategory;
          if(state.currentMainCategory !== "noun"){
            state.currentSubCategory = "all";
          }
          syncCategoryBars();
          renderWordCards();
          renderStats();
          saveState();
        });
      });

      document.querySelectorAll("[data-sub-category]").forEach(btn => {
        btn.addEventListener("click", () => {
          state.currentSubCategory = btn.dataset.subCategory;
          syncCategoryBars();
          renderWordCards();
          saveState();
        });
      });

      document.getElementById("toggleMeaningBtn").addEventListener("click", () => {
        state.showAllMeanings = !state.showAllMeanings;
        renderWordCards();
        saveState();
      });

      document.getElementById("randomSentenceBtn").addEventListener("click", () => {
        makeRandomSentence();
      });

      document.getElementById("speakSentenceBtn").addEventListener("click", () => {
        speakText(state.sentence);
      });

      document.getElementById("wordList").addEventListener("click", (e) => {
        const audioBtn = e.target.closest(".audio-btn");
        if(audioBtn){
          e.stopPropagation();
          speakText(audioBtn.dataset.audio);
          return;
        }

        const card = e.target.closest(".word-card");
        if(card){
          card.classList.toggle("show-answer");
        }
      });

      document.querySelectorAll(".phrase-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          renderPhraseGroup(btn.dataset.phraseGroup);
        });
      });

      document.getElementById("phrasePanel").addEventListener("click", (e) => {
        const audioBtn = e.target.closest(".phrase-audio-btn");
        if(audioBtn){
          e.stopPropagation();
          speakText(audioBtn.dataset.audio);
          return;
        }

        const card = e.target.closest(".phrase-item");
        if(card){
          card.classList.toggle("show");
        }
      });

      document.getElementById("startQuizBtn").addEventListener("click", () => {
        startQuiz();
      });

      document.getElementById("quizBox").addEventListener("click", (e) => {
        const btn = e.target.closest(".answer-btn");
        if(!btn) return;
        handleQuizAnswer(btn.dataset.answer);
      });

      document.getElementById("gachaOneBtn").addEventListener("click", () => {
        gachaPull(1);
      });

      document.getElementById("gachaTenBtn").addEventListener("click", () => {
        gachaPull(10);
      });

      document.getElementById("resetBtn").addEventListener("click", () => {
        const ok = confirm("ローカル保存データ（コイン・ガチャ履歴・最高点）を初期化しますか？");
        if(!ok) return;
        localStorage.removeItem(STORAGE_KEY);
        location.reload();
      });
    }

    /************************************************************
     * 19) 初期化
     ************************************************************/
    function init(){
      loadState();
      state.classified = buildClassifiedDatabase(RAW_WORDS);
      bindEvents();
      syncCategoryBars();
      switchTab(state.currentTab);
      renderWordCards();
      renderSentenceBoard();
      renderCoin();
      renderStats();
      renderPhraseGroup("greeting");
    }

    init();
  </script>
</body>
</html>
